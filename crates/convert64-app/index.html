<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Convert64</title>

    <!-- trunk: build this crate's binary for wasm32 and run wasm-opt on release builds. -->
    <link data-trunk rel="rust" data-bin="convert64-app" data-wasm-opt="2" />
    <base data-trunk-public-url />

    <style>
        html, body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background: #404040;
            touch-action: manipulation;
        }

        /* The eframe canvas fills the page and is resized by eframe. */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font: 16px Helvetica, Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- The id must match main.rs. -->
    <canvas id="convert64_canvas"></canvas>

    <!-- Removed by main.rs once the app is running. -->
    <div class="centered" id="loading_text">
        <noscript>Convert64 needs JavaScript and WebAssembly.</noscript>
        <p>Loading Convert64…</p>
    </div>
</body>
</html>
