[package]
name = "convert64-cli"
description = "Headless convert64 command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
convert64-core = { workspace = true, features = ["parallel"] }
convert64-formats = { workspace = true }
convert64-project = { workspace = true, features = ["fs"] }
clap = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
image = { workspace = true }
# The parity test drives the MCP server's tools in-process (tests/parity.rs).
convert64-mcp = { workspace = true }

[lints]
workspace = true

[lib]
name = "convert64_cli"
path = "src/lib.rs"

[[bin]]
name = "convert64"
path = "src/main.rs"

# Built and released by cargo-dist (dist-workspace.toml).
[package.metadata.dist]
dist = true
