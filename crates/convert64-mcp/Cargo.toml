[package]
name = "convert64-mcp"
description = "MCP server exposing the convert64 command registry over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
convert64-core = { workspace = true, features = ["parallel"] }
convert64-cli = { workspace = true }
convert64-project = { workspace = true, features = ["fs"] }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }

[lints]
workspace = true

[lib]
name = "convert64_mcp"
path = "src/lib.rs"

[[bin]]
name = "convert64-mcp"
path = "src/main.rs"
