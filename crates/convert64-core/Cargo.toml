[package]
name = "convert64-core"
description = "Pure, I/O-free document model, command registry, compositor, solvers and validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Opt-in data parallelism via rayon. Off by default so the crate builds for
# wasm32-unknown-unknown unchanged (CLAUDE.md non-negotiable 2).
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
image = { workspace = true }
convert64-formats = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
