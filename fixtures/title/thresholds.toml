# Golden-harness thresholds for this fixture (crates/convert64-core/tests/golden.rs).
#
# mse_vs_golden_max: highest allowed mean squared OKLab distance between the solver's
# rendered output and expected.png. 0.0002 is about a quarter of a just-noticeable
# OKLab difference (~0.03) squared, averaged over every pixel: tiny drifts pass,
# visible changes fail. Raise it only with a reason in the PR.
mse_vs_golden_max = 0.0002

# png2c64_mse_vs_source: the png2c64 baseline's mean squared OKLab distance from the
# source (box-filtered to the target grid), measured by the golden harness with the same
# code as ours. The quality bar (#111): our solve must be within this value + 2 %.
png2c64_mse_vs_source = 0.02323
