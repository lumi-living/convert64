# Eye-ranked pairs from Jaakko's reviews of PR #273's sheets (2026-10-18).
#
# One entry per pair he judged: `winner` looked better than `loser` by eye. These are
# the reference any quality metric must agree with before it is used for a gate or in
# the UI (≥ 90 % of pairs; TAD §6). `cargo xtask metric-check` scores each candidate
# metric against them.
#
# Variant names (what each sheet tile was; every tile is Pepto and multicolor, except
# lineart's, which are hi-res like its png2c64 baseline):
# - baselines sheet (`sheet-reference-baselines.png`):
#   `png2c64` = the fixture's png2c64 baseline (checker 0.7, error clamp 0.1, gamma 1.5);
#   `png2amiga` = png2amiga's baseline as #273 rendered it, with the flags that sheet used.
# - match-range sheet (`sheet-match-range.png`), all png2amiga at the same flags as its
#   baseline tile: `off`, `box` (png2c64's OKLab box stretch), `hull` (png2amiga's
#   per-(L, hue) hull); `png2c64-baseline` = the fixture's png2c64 baseline, which he
#   compared against all three.
# - refine sheet (`sheet-refine.png`): png2amiga with refine `off` and `on`.
# - large-sources sheet (`sheet-large-sources.png`), zone plate only:
#   `old-mitchell-mip` (#257), `png2amiga-exact`, `mip-accelerated`.
#
# `confidence = "low"` marks pairs he called hard to judge (terrain is a stress case, #274).
# Pairs he called equal ("Off = hull" on lineart) or mixed (Refine on photo), and the
# grainy-title row ("all three very similar"), are not ranked and are left out.

# --- baselines -------------------------------------------------------------------------

[[pair]]
sheet = "baselines"
fixture = "portrait"
winner = "png2c64"
loser = "png2amiga"
note = "Slightly. png2amiga has individual black pixels around the edges; png2c64's highlights have more shades."

[[pair]]
sheet = "baselines"
fixture = "title"
winner = "png2c64"
loser = "png2amiga"
note = "Clearly. More detail in the snow, trees and soldiers; a better gradient in the sky."

[[pair]]
sheet = "baselines"
fixture = "photo"
winner = "png2c64"
loser = "png2amiga"
note = "Clearly. More detail and shades in the forest, hay, snow and horizon."

[[pair]]
sheet = "baselines"
fixture = "lineart"
winner = "png2amiga"
loser = "png2c64"
note = "The lines stay more even, although grey instead of black and with some green bleed."

[[pair]]
sheet = "baselines"
fixture = "gradient"
winner = "png2c64"
loser = "png2amiga"
note = "Cleaner solids, better transitions within the gradients, sharper horizontal transitions."

[[pair]]
sheet = "baselines"
fixture = "terrain"
winner = "png2c64"
loser = "png2amiga"
confidence = "low"
note = "Hard to judge: the source has more detail than the cells can hold. png2c64 still wins."

