# The line-art recipe (ADR-014 §4): an opt-in for black-and-white line art, chosen by eye
# on #273's cause sheet (tile 13) and made on the reference path (png2c64's port).
# Thin lines come out more even and dark, with no colour bleeding in. It does not suit
# coloured art or logos: the black point turns dark colours black, and the colour limit
# turns everything grey (docs/reference/dither-previews/convert64-sheets/sheet-lineart.png).
#
# As a batch manifest, for every PNG in a directory:
#
#     convert64 batch art/ --manifest examples/recipes/lineart.toml --out build/
#
# The same on one picture:
#
#     convert64 convert lineart.png --mode hires --dither none --gamma 1.5 \
#         --resample lanczos --black-point 0.5 --allowed 0,11,12,15,1 -o lineart.art
#
# In the app: Mode Hi-res; Dither None; Gamma 1.5 and Black point 50 % (Adjustments);
# Resample Lanczos (Transform); Allowed limited to black, dark grey, grey, light
# grey and white (Colour fitting).

[defaults]
mode = "hires"            # hi-res bitmap (Art Studio)
dither = "none"           # each pixel the nearer of its cell's two colours
gamma = 1.5               # png2c64's default gamma
resample = "lanczos"      # png2amiga's widened Lanczos-3: more even thin lines
black-point = 0.5         # png2c64's --black-point: darker half of lightness to black
allowed = "0,11,12,15,1"  # Pepto's greys: black, dark grey, grey, light grey, white
outputs = ["art"]
