# Manual test build of the cargo-dist macOS archives (#24).
# Real releases come from release.yml (generated by `dist generate`) on
# version tags. This workflow only builds and uploads workflow artifacts:
# no GitHub release, no tag, nothing published.
name: dist build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIST_VERSION: v0.33.0

jobs:
  build:
    name: dist build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runners dist plan picks for these targets.
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: dist-${{ matrix.target }}
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: dist build
        run: dist build --artifacts=local --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: convert64-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.tar.xz.sha256
          if-no-files-found: error
