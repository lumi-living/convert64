name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The job name and matrix key are fixed: branch protection on main requires
  # the contexts "rust (ubuntu-latest)", "rust (macos-latest)" and
  # "rust (windows-latest)". Renaming them breaks merging.
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs exactly what rust-toolchain.toml pins (channel, components, targets).
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      # The png2c64 parity test runs in its own step below, so its report shows.
      - name: cargo test
        run: cargo test --workspace -- --skip png2c64_parity
      # The standing bar of #181: the reference solver against png2c64's renders,
      # >= 99 % identical per method id and input; prints every percentage.
      - name: png2c64 parity
        run: cargo test -p convert64-core --test png2c64_parity -- --nocapture
      # The No Glory title screen builds from make with the CLI alone (#167); `cargo
      # test` has just built target/debug/convert64. Windows runners have no make.
      - name: make check (examples/no-glory)
        if: runner.os != 'Windows'
        run: make -C examples/no-glory CONVERT64="$GITHUB_WORKSPACE/target/debug/convert64" check

  # Fixed name: branch protection on main requires the "wasm" context.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: v0.21.14
    steps:
      - uses: actions/checkout@v7.0.1
      # rust-toolchain.toml already lists the wasm32-unknown-unknown target.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C "$HOME/.cargo/bin" trunk
          trunk --version
      # Default features only: fails if the core gains a dependency that does
      # not build for wasm32 outside the `parallel` feature.
      - name: cargo check core (wasm32)
        run: cargo check -p convert64-core --target wasm32-unknown-unknown
      - name: trunk build --release
        working-directory: crates/convert64-app
        run: trunk build --release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: convert64-web
          path: crates/convert64-app/dist/
          if-no-files-found: error
