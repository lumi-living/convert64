[workspace]
resolver = "3"
members = [
    "crates/convert64-core",
    "crates/convert64-formats",
    "crates/convert64-project",
    "crates/convert64-cli",
    "crates/convert64-mcp",
    "crates/convert64-app",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/lumi-living/convert64"
authors = ["Lumi Living <https://github.com/lumi-living>"]
publish = false

# Every external crate is pinned here and referenced from the member crates
# with `{ workspace = true }` (docs/TAD.md §4 lists the allowed set).
[workspace.dependencies]
convert64-core = { path = "crates/convert64-core" }
convert64-formats = { path = "crates/convert64-formats" }
convert64-project = { path = "crates/convert64-project" }
convert64-cli = { path = "crates/convert64-cli" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
proptest = "1.11.0"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
insta = "1.48.0"
serde_json = "1"
toml = "1.1"
# glow (OpenGL / WebGL2) renderer instead of the default wgpu: ADR-006 keeps
# the app wgpu-free. Otherwise eframe's default feature set.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.36.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
